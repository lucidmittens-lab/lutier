# Test defaults -- see CLAUDE.md, "Running the app and tests".
# The suite runs offscreen (QT_QPA_PLATFORM=offscreen, DISPLAY unset);
# ./run_linux.sh test sets that up. tests/conftest.py makes runs parallel
# (pytest-xdist, -n auto --dist loadgroup) when xdist is installed;
# pass -n 0 for a single process (pdb, -x on one failing test).
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    gl: needs a real OpenGL context (real display or Xvfb); skipped by a normal run, selected by --gl
    xdist_group(name): run these tests on one pytest-xdist worker, in order (see conftest.SAME_WORKER_FILES)
